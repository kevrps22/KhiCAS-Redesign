# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        # Uniquement ce dont l'installeur a besoin (les sources des apps contiennent
        # des liens symboliques cassés qui font échouer l'archivage).
        run: |
          mkdir -p _site/apps
          cp -r index.html index.js index.css libs images firmware _site/
          cp apps/apps.js apps/external.ld _site/apps/
          for d in apps/*/; do
            n=$(basename "$d")
            [ -f "$d/app.elf" ] || continue
            mkdir -p "_site/apps/$n"
            cp "$d/app.elf" "_site/apps/$n/"
            for f in app.icon icon.png; do [ -f "$d/$f" ] && cp "$d/$f" "_site/apps/$n/"; done
          done
          du -sh _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
